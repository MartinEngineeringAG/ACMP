name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ACMP.slnx --locked-mode

      - name: Build
        run: dotnet build ACMP.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ACMP.slnx --configuration Release --no-build

      - name: Check vulnerable packages
        run: dotnet list ACMP.slnx package --vulnerable --include-transitive

      - name: Check deprecated packages
        run: dotnet list ACMP.slnx package --deprecated --include-transitive

  packages:
    name: Package validation
    runs-on: windows-latest
    needs: dotnet

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ACMP.slnx --locked-mode

      - name: Build
        run: dotnet build ACMP.slnx --configuration Release --no-restore

      - name: Pack NuGet package
        shell: pwsh
        run: |
          dotnet pack .\src\ACMP\ACMP.csproj `
            --configuration Release `
            --no-build `
            --output .\artifacts\nuget `
            -p:Version=0.0.0-ci

      - name: Test NuGet package
        shell: pwsh
        run: |
          .\build\Test-NuGetPackage.ps1 `
            -PackageDirectory .\artifacts\nuget `
            -Version 0.0.0-ci

      - name: Build PowerShell module
        shell: pwsh
        run: .\build\Build-PowerShellModule.ps1 -Version 0.0.0

      - name: Validate module with PowerShell 7
        shell: pwsh
        run: |
          $manifestPath = '.\artifacts\powershell\ACMP\ACMP.psd1'
          Test-ModuleManifest -Path $manifestPath -ErrorAction Stop | Out-Null
          Import-Module -Name $manifestPath -Force -ErrorAction Stop
          $commands = @(Get-Command -Module ACMP)
          if ($commands.Count -ne 74) {
              throw "Expected 74 ACMP cmdlets, found $($commands.Count)."
          }
          if ($commands.Name | Where-Object { $PSItem -notmatch '^[A-Za-z]+-ACMP' }) {
              throw 'The module exports a command outside the ACMP naming scheme.'
          }

      - name: Validate module with Windows PowerShell 5.1
        shell: powershell
        run: |
          $manifestPath = '.\artifacts\powershell\ACMP\ACMP.psd1'
          Test-ModuleManifest -Path $manifestPath -ErrorAction Stop | Out-Null
          Import-Module -Name $manifestPath -Force -ErrorAction Stop
          $commands = @(Get-Command -Module ACMP)
          if ($commands.Count -ne 74) {
              throw "Expected 74 ACMP cmdlets, found $($commands.Count)."
          }
          if ($commands.Name | Where-Object { $PSItem -notmatch '^[A-Za-z]+-ACMP' }) {
              throw 'The module exports a command outside the ACMP naming scheme.'
          }

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acmp-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            artifacts/powershell/ACMP

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
